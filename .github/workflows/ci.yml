
name: CI Flask Videojuegos

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: clave_temporal_ci
          MYSQL_DATABASE: juegos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pclave_temporal_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: mysql+pymysql://root:clave_temporal_ci@127.0.0.1:3306/juegos_test
      FLASK_SECRET_KEY: clave_temporal_ci_flask
      DATABASE_URL: mysql+pymysql://root:clave_temporal_ci@127.0.0.1:3306/juegos_test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas y cobertura
        run: |
          python -m pytest tests/ -v --cov=api --cov=models --cov=controllers --cov-report=xml

      - name: Enviar cobertura a Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
